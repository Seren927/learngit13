[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrepolens"
version = "1.0.0"
description = "A lightweight open-source repository health scanner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zheng Qianhuan", email = "Seren927@users.noreply.github.com" }]
keywords = ["open-source", "repository-health", "documentation", "github"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Seren927/learngit13"
Issues = "https://github.com/Seren927/learngit13/issues"

[project.scripts]
openrepolens = "openrepolens.cli:main"

[tool.setuptools.packages.find]
include = ["openrepolens*"]

[tool.ruff]
line-length = 100
target-version = "py310"

