name: 功能建议
description: 提议新的检查规则、使用场景或界面改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前流程在哪里让使用者感到困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、输入与输出。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交检查
      options:
        - label: 我已搜索现有 Issue 和文档
          required: true
        - label: 该建议与项目目标相关
          required: true

